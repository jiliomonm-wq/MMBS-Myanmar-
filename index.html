<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MMBS POS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#2e9e5b;--gd:#238049;--ink:#222;--mute:#80868b;--line:#e4e6e8;--bg:#f1f3f4;--bad:#d93025}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans Myanmar","Padauk",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:6px;padding:.5rem 1rem;background:var(--g);color:#fff;font-weight:600}
button:active{background:var(--gd)}
button.flat{background:transparent;color:var(--g)}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.red{background:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{border:1px solid var(--line);border-radius:6px;padding:.5rem .7rem;background:#fff;width:100%;outline:none}

.top{height:52px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 1rem;flex-shrink:0}
.top h1{font-size:1.15rem;font-weight:700}

/* အောက်ခြေ မီနူးဘား */
.bottom-nav{height:58px;background:#fff;border-top:1px solid var(--line);display:flex;flex-shrink:0;z-index:100}
.bottom-nav button{flex:1;background:transparent;color:var(--mute);border-radius:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:0.75rem;font-weight:500;gap:2px}
.bottom-nav button.on{color:var(--g);font-weight:700}
.bottom-nav button .icon{font-size:1.25rem;line-height:1}

main{flex:1;min-height:0;position:relative}
.view{display:none;position:absolute;inset:0}
.view.on{display:flex}

#v-sales{background:var(--bg)}
.catalog{flex:1;display:flex;flex-direction:column;min-width:0}
.tools{display:flex;gap:.6rem;padding:.7rem;background:#fff;border-bottom:1px solid var(--line)}
.tiles{flex:1;overflow:auto;padding:.7rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.6rem;align-content:start}
.tile{position:relative;height:100px;border-radius:8px;color:#fff;text-align:left;padding:.55rem .65rem;display:flex;flex-direction:column;justify-content:flex-end;font-weight:600;line-height:1.4;overflow:hidden}
.tile small{font-weight:400;opacity:.9}
.tile .st{position:absolute;top:.4rem;right:.5rem;font-size:.75rem;background:#0003;border-radius:99px;padding:0 .5rem;font-weight:600}
.empty{color:var(--mute);padding:2rem;text-align:center;grid-column:1/-1;width:100%}

.ticket{width:360px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column}
.thead{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.tlist{flex:1;overflow:auto}
.tr{display:flex;align-items:center;gap:.5rem;padding:.6rem 1rem;border-bottom:1px solid var(--line)}
.tr .n{flex:1;min-width:0}
.tr small{color:var(--mute);display:block}
.qty{display:flex;align-items:center;gap:.3rem}
.qty button{width:28px;height:28px;padding:0;border-radius:50%;background:var(--bg);color:var(--ink);font-size:1.1rem;line-height:1}
.qty span{min-width:1.3rem;text-align:center;font-weight:600}
.tr .amt{min-width:78px;text-align:right}
.tfoot{padding:.7rem 1rem 1rem;border-top:1px solid var(--line)}
.charge{width:100%;margin-top:.6rem;padding:.8rem;font-size:1.1rem;border-radius:8px}
.cartBar{display:none}

.page{flex:1;overflow:auto;max-width:820px;margin:0 auto;width:100%;padding:1rem}
.row{display:flex;align-items:center;gap:.8rem;background:#fff;border-bottom:1px solid var(--line);padding:.7rem 1rem;cursor:pointer;text-align:left;width:100%;color:var(--ink);border-radius:0;font-weight:400}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:var(--mute)}
.dot{width:36px;height:36px;border-radius:8px;flex-shrink:0}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fab{position:fixed;right:1.2rem;bottom:4.8rem;width:56px;height:56px;border-radius:50%;font-size:2rem;padding:0;box-shadow:0 3px 10px rgba(0,0,0,0.3);z-index:90;display:flex;align-items:center;justify-content:center}

/* login */
#login{position:fixed;inset:0;background:var(--g);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
#login.on{display:flex}
#login form{background:#fff;border-radius:14px;padding:1.6rem;width:min(94vw,360px)}
#login h2{font-size:1.8rem;font-weight:800;text-align:center}
#login p{text-align:center;color:var(--mute);margin-bottom:1.2rem}
#login .field{margin-bottom:.8rem}
#loginErr{color:var(--bad);font-size:.85rem;min-height:1.4rem;margin-bottom:.8rem}

dialog{margin:auto;border:0;border-radius:12px;padding:1.3rem;width:min(94vw,390px);max-height:92dvh;overflow:auto}
dialog::backdrop{background:#0007}
.field{margin-bottom:.9rem}
.field label{display:block;font-size:.85rem;color:var(--mute)}
.acts{display:flex;gap:.5rem;margin-top:1rem}
.acts button{flex:1}

@media(max-width:820px){
  #v-sales{flex-direction:column}
  .ticket{position:fixed;left:0;right:0;bottom:58px;width:auto;height:70dvh;border-radius:14px 14px 0 0;box-shadow:0 -4px 14px #0003;transform:translateY(110%);transition:transform .22s;z-index:80}
  .ticket.on{transform:none}
  .cartBar{display:flex;justify-content:space-between;align-items:center;width:100%;border-radius:0;padding:.8rem 1.2rem;font-size:1rem}
}
</style>
</head>
<body>

<!-- Login Modal -->
<div id="login">
  <form id="lf">
    <h2>MMBS</h2><p>ဝင်ရောက်ရန်</p>
    <div class="field"><label>အီးမေးလ်</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label>စကားဝှက်</label><input id="lPass" type="password" autocomplete="current-password" required></div>
    <div id="loginErr"></div>
    <button type="submit" style="width:100%;padding:.8rem" id="lBtn">ဝင်မည်</button>
  </form>
</div>

<header class="top">
  <h1 id="title">အရောင်း</h1>
  <button id="logoutBtn" style="background:transparent;padding:4px 8px;font-size:0.85rem;">ထွက်မည်</button>
</header>

<main>
  <!-- 1. အရောင်းစာမျက်နှာ -->
  <section class="view on" id="v-sales">
    <div class="catalog">
      <div class="tools">
        <input id="q" placeholder="ပစ္စည်းရှာရန်..." autocomplete="off">
      </div>
      <div class="tiles" id="tiles"></div>
      <button class="cartBar" id="cartBar"></button>
    </div>
    <div class="ticket" id="ticket">
      <div class="thead"><b>ဘောက်ချာ</b><span><button class="flat" id="closeT">ပိတ်</button><button class="flat" id="clearT">ရှင်းမည်</button></span></div>
      <div class="tlist" id="tlist"></div>
      <div class="tfoot">
        <button class="charge" id="chargeBtn">ငွေရှင်းမည်</button>
      </div>
    </div>
  </section>

  <!-- 2. ဘောက်ချာများ စာမျက်နှာ -->
  <section class="view" id="v-receipts"><div class="page" id="rlist"></div></section>

  <!-- 3. ပစ္စည်းများ စာမျက်နှာ -->
  <section class="view" id="v-items">
    <div class="page"><div class="card" id="ilist"></div></div>
    <button class="fab" id="addItem" aria-label="ပစ္စည်းထည့်">+</button>
  </section>

  <!-- 4. ဆက်တင် စာမျက်နှာ -->
  <section class="view" id="v-settings"><div class="page" style="max-width:520px">
    <div class="field"><label>ဆိုင်အမည်</label><input id="cName"></div>
    <button id="cSave" style="width:100%">သိမ်းမည်</button>
  </div></section>
</main>

<!-- Bottom Nav Bar -->
<nav class="bottom-nav">
  <button type="button" data-v="sales" class="on"><span class="icon">🛒</span>အရောင်း</button>
  <button type="button" data-v="receipts"><span class="icon">📄</span>ဘောက်ချာ</button>
  <button type="button" data-v="items"><span class="icon">📦</span>ပစ္စည်းများ</button>
  <button type="button" data-v="settings"><span class="icon">⚙️</span>ဆက်တင်</button>
</nav>

<!-- ပစ္စည်းထည့်သည့် Modal -->
<dialog id="itemD">
  <h3 id="itemTitle">ပစ္စည်းအသစ်</h3>
  <div class="field"><label>အမည်</label><input id="iN"></div>
  <div class="field"><label>ရောင်းဈေး (ကျပ်)</label><input id="iP" type="number" min="0"></div>
  <div class="field"><label>လက်ကျန်</label><input id="iS" type="number" min="0"></div>
  <div class="field"><label>SKU / Barcode</label><input id="iK"></div>
  <div class="acts"><button class="ghost" id="iCancel">မလုပ်တော့ပါ</button><button id="iSave">သိမ်းမည်</button></div>
</dialog>

<script>
// အရင် Cache ကျန်နေသော Service Worker အဟောင်းများကို အပြီးသတ်ဖျက်ပစ်ခြင်း
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(registrations => {
    for (let r of registrations) r.unregister();
  });
}

const SB_URL = 'https://kbjjzdkpxvinlgwbhrzp.supabase.co';
const SB_KEY = 'sb_publishable_O69tVRXhyHxNz8j5hl48Tg_WLzI6RLZ';
const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

const $ = s => document.querySelector(s);
const money = n => Math.round(n).toLocaleString('en-US') + ' ကျပ်';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let products = [], sales = [], cart = {}, view = 'sales';
const byId = id => products.find(p => p.id == id);

/* ── Data Fetch ── */
async function loadProducts(){
  const {data, error} = await sbClient.from('products').select('*').order('name');
  if (!error && data) products = data.map(p => ({...p, price:+p.price, stock:+p.stock}));
}
async function loadSales(){
  const {data, error} = await sbClient.from('sales').select('*').order('sold_at', {ascending:false}).limit(100);
  if (!error && data) sales = data;
}

/* ── Auth ── */
$('#lf').onsubmit = async e => {
  e.preventDefault();
  $('#loginErr').textContent = '';
  $('#lBtn').disabled = true;
  const {data, error} = await sbClient.auth.signInWithPassword({email: $('#lEmail').value.trim(), password: $('#lPass').value});
  $('#lBtn').disabled = false;
  if (error) return $('#loginErr').textContent = error.message;
  $('#login').classList.remove('on');
  await initApp();
};

$('#logoutBtn').onclick = async () => {
  await sbClient.auth.signOut();
  $('#login').classList.add('on');
};

/* ── Navigation ── */
const titles = {sales:'အရောင်း', receipts:'ဘောက်ချာများ', items:'ပစ္စည်းများ', settings:'ဆက်တင်'};
function go(v){
  view = v;
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#title').textContent = titles[v];
  if (v==='sales') renderSales();
  if (v==='receipts') renderReceipts();
  if (v==='items') renderItems();
}

document.querySelectorAll('.bottom-nav button').forEach(b => {
  b.onclick = () => go(b.dataset.v);
});

/* ── Items View ── */
function renderItems(){
  $('#ilist').innerHTML = products.map(p => `
    <div class="row">
      <div class="grow"><b>${esc(p.name)}</b><small>လက်ကျန်: ${p.stock}</small></div>
      <b>${money(p.price)}</b>
    </div>
  `).join('') || '<div class="empty">ပစ္စည်း မရှိသေးပါ။ အောက်ညာထောင့်က <b>+ ခလုတ်</b> နှိပ်ပြီး ထည့်ပါ</div>';
}

$('#addItem').onclick = () => {
  $('#iN').value = ''; $('#iP').value = ''; $('#iS').value = ''; $('#iK').value = '';
  $('#itemD').showModal();
};
$('#iCancel').onclick = () => $('#itemD').close();
$('#iSave').onclick = async () => {
  const name = $('#iN').value.trim();
  if (!name || $('#iP').value === '') return alert('အမည်နှင့် ဈေးနှုန်း ထည့်ပါ');
  const d = {name, sku: $('#iK').value.trim() || null, price: +$('#iP').value, stock: +$('#iS').value || 0};
  const {error} = await sbClient.from('products').insert(d);
  if (error) return alert('သိမ်းဆည်းမရပါ: ' + error.message);
  $('#itemD').close();
  await loadProducts();
  renderItems();
};

/* ── Sales View ── */
function renderSales(){
  const k = $('#q').value.trim().toLowerCase();
  const list = products.filter(p => p.name.toLowerCase().includes(k));
  $('#tiles').innerHTML = list.map(p => `
    <button class="tile" data-id="${p.id}" style="background:#2e9e5b" ${p.stock<=0?'disabled':''}>
      <span class="st">${p.stock}</span>${esc(p.name)}<small>${money(p.price)}</small>
    </button>
  `).join('') || '<div class="empty">ပစ္စည်း မရှိသေးပါ (အောက်က "ပစ္စည်းများ" တွင် အရင်ထည့်ပါ)</div>';

  $('#tiles').querySelectorAll('.tile').forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    cart[id] = (cart[id]||0) + 1;
    renderTicket();
  });
  renderTicket();
}

function renderTicket(){
  const ids = Object.keys(cart);
  $('#tlist').innerHTML = ids.map(id => {
    const p = byId(id);
    return `<div class="tr"><div class="n">${esc(p.name)}<small>${money(p.price)}</small></div>
    <div class="qty"><button onclick="subCart('${id}')">−</button><span>${cart[id]}</span><button onclick="addCart('${id}')">+</button></div>
    <div class="amt">${money(p.price*cart[id])}</div></div>`;
  }).join('') || '<div class="empty">ပစ္စည်း မရွေးရသေးပါ</div>';

  const tot = ids.reduce((s, id) => s + (byId(id)?.price || 0) * cart[id], 0);
  $('#chargeBtn').textContent = 'ငွေရှင်းမည် ' + money(tot);
  $('#cartBar').innerHTML = `<span>ဘောက်ချာ (${ids.length})</span><b>${money(tot)}</b>`;
}

window.addCart = id => { cart[id]++; renderTicket(); };
window.subCart = id => { if (--cart[id] <= 0) delete cart[id]; renderTicket(); };
$('#cartBar').onclick = () => $('#ticket').classList.add('on');
$('#closeT').onclick = () => $('#ticket').classList.remove('on');
$('#clearT').onclick = () => { cart = {}; renderTicket(); };

/* ── Receipts View ── */
function renderReceipts(){
  $('#rlist').innerHTML = sales.map(s => `
    <div class="row">
      <div class="grow"><b>${money(s.total)}</b><small>#${esc(s.no || s.id)}</small></div>
      <small>${new Date(s.sold_at).toLocaleTimeString()}</small>
    </div>
  `).join('') || '<div class="empty">ဘောက်ချာ မရှိသေးပါ</div>';
}

async function initApp(){
  await Promise.all([loadProducts(), loadSales()]);
  go('sales');
}

// စတင် စစ်ဆေးခြင်း
(async () => {
  const {data:{session}} = await sbClient.auth.getSession();
  if (session) {
    initApp();
  } else {
    $('#login').classList.add('on');
  }
})();
</script>
</body>
</html>
